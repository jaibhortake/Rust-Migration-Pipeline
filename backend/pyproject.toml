[project]
name = "migration-backend"
version = "0.1.0"
description = "C++/Python to Rust migration pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-python>=0.23",
    "itsdangerous>=2.2",
    "aiosqlite>=0.20",
    "truststore>=0.10",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
